name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v5
    - name: setup
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: test
      run: |
        cd src
        dotnet test --configuration Release
